name: junuban

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: junuban
      POSTGRES_PASSWORD: junuban_dev_password
      POSTGRES_DB: junuban
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U junuban -d junuban"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./.docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: junuban
      MINIO_ROOT_PASSWORD: junuban_dev_password
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - ./.docker-data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the default product-media bucket on startup. Runs once and exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 junuban junuban_dev_password; do sleep 1; done;
      mc mb -p local/junuban-media || true;
      mc anonymous set download local/junuban-media;
      exit 0;
      "

networks:
  default:
    name: junuban_network
